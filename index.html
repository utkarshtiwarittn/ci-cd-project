<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CI/CD DevOps Training | Deployment Successful</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #fff;
        background: radial-gradient(
            circle at top left,
            #1d4ed8 0%,
            transparent 35%
          ),
          radial-gradient(circle at bottom right, #7c3aed 0%, transparent 35%),
          linear-gradient(135deg, #020617, #0f172a 50%, #111827);
        overflow: hidden;
      }

      /* Background decorative circles */
      body::before,
      body::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(2px);
        opacity: 0.25;
      }

      body::before {
        width: 300px;
        height: 300px;
        background: #06b6d4;
        top: -100px;
        right: -80px;
      }

      body::after {
        width: 250px;
        height: 250px;
        background: #8b5cf6;
        bottom: -100px;
        left: -80px;
      }

      .container {
        position: relative;
        z-index: 1;
        width: min(90%, 650px);
        padding: 50px 40px;
        text-align: center;

        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45),
          inset 0 1px 1px rgba(255, 255, 255, 0.08);

        animation: fadeIn 0.8s ease-out;
      }

      .icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 25px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;
        font-size: 38px;

        background: linear-gradient(135deg, #22c55e, #06b6d4);
        box-shadow: 0 0 25px rgba(34, 197, 94, 0.35),
          0 0 50px rgba(6, 182, 212, 0.15);

        animation: pulse 2s infinite;
      }

      h1 {
        font-size: clamp(2rem, 5vw, 3.2rem);
        margin-bottom: 12px;
        font-weight: 700;

        background: linear-gradient(90deg, #38bdf8, #a78bfa, #22c55e);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle {
        color: #cbd5e1;
        font-size: 1.1rem;
        margin-bottom: 35px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 9px 16px;
        margin-bottom: 30px;

        color: #86efac;
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.25);
        border-radius: 999px;

        font-size: 0.9rem;
        font-weight: 600;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        background: #22c55e;
        border-radius: 50%;
        box-shadow: 0 0 10px #22c55e;
      }

      .info-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        text-align: left;
      }

      .info-card {
        padding: 20px;
        border-radius: 16px;

        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);

        transition: all 0.3s ease;
      }

      .info-card:hover {
        transform: translateY(-5px);
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(56, 189, 248, 0.35);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      .label {
        display: block;
        color: #94a3b8;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 7px;
      }

      .value {
        color: #f8fafc;
        font-size: 1.05rem;
        font-weight: 600;
      }

      .footer {
        margin-top: 35px;
        color: #64748b;
        font-size: 0.85rem;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(25px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          box-shadow: 0 0 25px rgba(34, 197, 94, 0.35),
            0 0 50px rgba(6, 182, 212, 0.15);
        }

        50% {
          transform: scale(1.06);
          box-shadow: 0 0 35px rgba(34, 197, 94, 0.5),
            0 0 65px rgba(6, 182, 212, 0.25);
        }
      }

      @media (max-width: 550px) {
        .container {
          padding: 40px 22px;
        }

        .info-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <main class="container">
      <div class="icon">✓</div>

      <div class="status">
        <span class="status-dot"></span>
        Deployment Successful
      </div>

      <h1>DevOps Training</h1>

      <p class="subtitle">Your application is up and running successfully 🚀</p>

      <section class="info-grid">
        <div class="info-card">
          <span class="label">☁ Infrastructure</span>
          <span class="value">AWS EC2</span>
        </div>

        <div class="info-card">
          <span class="label">🌐 Web Server</span>
          <span class="value">NGINX</span>
        </div>

        <div class="info-card">
          <span class="label">⚡ Status</span>
          <span class="value">Online</span>
        </div>

        <div class="info-card">
          <span class="label">🔒 Environment</span>
          <span class="value">Production</span>
        </div>
      </section>

      <p class="footer">Built with ❤️ for DevOps Training</p>
    </main>
  </body>
</html>
